<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Veylith moving platform regression</title>
    <style>
      html,
      body,
      #game {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #052c35;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module">
      import Phaser from 'phaser';
      import { createGameConfig } from '../src/game/core/GameConfig.ts';
      import { ActionState } from '../src/game/systems/input/ActionState.ts';
      import { LevelProgress } from '../src/game/levels/LevelProgress.ts';
      import { RunSession } from '../src/game/session/RunSession.ts';
      import {
        completeLevel,
        emptyProgress,
      } from '../src/services/progress/progress.ts';
      let game,
        actions,
        progress,
        run,
        attempts = 0,
        saved = emptyProgress();
      window.smoke = {
        async start(level, levelDocument) {
          if (game) {
            game.destroy(true);
            await new Promise((resolve) =>
              requestAnimationFrame(() => requestAnimationFrame(resolve)),
            );
          }
          actions = new ActionState();
          progress = new LevelProgress();
          attempts = 0;
          run = new RunSession((ms, coinIds) => {
            const result = completeLevel(saved, level, ms, coinIds);
            saved = result.progress;
            return result.result;
          });
          await new Promise((resolve, reject) => {
            game = new Phaser.Game({
              ...createGameConfig(
                document.getElementById('game'),
                () => {
                  attempts++;
                  resolve();
                },
                1,
                {
                  level,
                  document: levelDocument,
                  input: actions,
                  progress,
                  run,
                  onError: reject,
                },
              ),
              fps: {
                target: Number(
                  new URLSearchParams(location.search).get('fps') || 60,
                ),
                forceSetTimeOut: true,
              },
            });
          });
        },
        document() {
          return structuredClone(
            game.scene.getScene('MainScene').forestPuzzle.layout.document,
          );
        },
        retry() {
          run.retry();
          actions.reset();
          actions.dispatch(
            { type: 'restart_level', phase: 'pressed' },
            'smoke',
          );
        },
        input(type, phase = 'pressed') {
          actions.dispatch({ type, phase }, 'smoke');
        },
        trace(durationMs) {
          const scene = game.scene.getScene('MainScene');
          return new Promise((resolve) => {
            const samples = [];
            let elapsed = 0;
            const sample = (_time, delta) => {
              elapsed += delta;
              const r = window.smoke.read();
              samples.push({
                ms: elapsed,
                x: r.x,
                feet: r.feet,
                vy: r.vy,
                grounded: r.grounded,
                animation: r.animation,
                visualFeet: r.visualFeet,
                colliderFeet: r.colliderFeet,
                attempts: r.attempts,
                platform: r.world.find((o) => o.kind === 'mechanical_elevator'),
              });
              if (elapsed >= durationMs) {
                scene.events.off('postupdate', sample);
                resolve(samples);
              }
            };
            scene.events.on('postupdate', sample);
          });
        },
        read() {
          const scene = game.scene.getScene('MainScene');
          const body = scene.player.body;
          return {
            world: scene.forestPuzzle.world.state.objects.map((o) => ({
              id: o.id,
              kind: o.kind,
              ...scene.forestPuzzle.world.state.get(o.id),
              body: (() => {
                const b = scene.forestPuzzle.world.bodies.get(o.id).body;
                return {
                  x: b.x,
                  y: b.y,
                  width: b.width,
                  height: b.height,
                  enable: b.enable,
                };
              })(),
            })),
            x: body.center.x,
            vx: body.velocity.x,
            vy: body.velocity.y,
            visualFeet: scene.player.visual.y,
            colliderFeet: scene.player.collider.y + body.halfHeight,
            platformListeners: scene.physics.world.listenerCount('worldstep'),
            feet: body.bottom,
            camera: {
              x: scene.cameras.main.scrollX,
              y: scene.cameras.main.scrollY,
              height: scene.cameras.main.displayHeight,
            },
            grounded: body.blocked.down || body.touching.down,
            element: scene.player.element,
            animation: scene.player.animation,
            animationFrame:
              scene.player.visual.sprite.anims.currentFrame?.index,
            snapshot: progress.getSnapshot(),
            run: run.getSnapshot(),
            attempts,
            coins: saved.coins,
            blockX: scene.forestPuzzle.heavyBlocks[0]?.body.center.x ?? 0,
            plateSolved: scene.forestPuzzle.layout.blocks[0]
              ? scene.forestPuzzle.state.isSolved(
                  scene.forestPuzzle.layout.blocks[0].plateId,
                )
              : false,
            block: scene.forestPuzzle.heavyBlocks[0]
              ? (() => {
                  const b = scene.forestPuzzle.heavyBlocks[0].body;
                  return {
                    x: b.center.x,
                    top: b.top,
                    bottom: b.bottom,
                    width: b.width,
                    height: b.height,
                    vx: b.velocity.x,
                    vy: b.velocity.y,
                    grounded: b.blocked.down || b.touching.down,
                  };
                })()
              : null,
          };
        },
      };
    </script>
  </body>
</html>
